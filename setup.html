 <!-- Link oficial do 7.css -->
 <link rel="stylesheet" href="https://unpkg.com/7.css">

 <style>
   /* Centraliza a janela na tela */
   body {
     background-color: #5170a4;
     display: flex;
     justify-content: center;
     align-items: center;
     height: 100vh;
     margin: 0;
   }

   /* Tamanho padrÃ£o da janela */
   .window {
     width: 600px;
     height: 450px;
     display: flex;
     flex-direction: column;
   }

   /* Esconde a janela quando o X for clicado */
   .window.hidden {
     display: none;
   }

   /* Corpo da janela com a moldura branca clÃ¡ssica */
   .window-body {
     flex: 1;
     display: flex;
     flex-direction: column;
     margin: 0;
     padding: 0;
     background: #ffffff;
     border: 4px solid #ffffff;
   }

   /* O iframe que ocupa o espaÃ§o interno da moldura */
   iframe {
     width: 100%;
     height: 100%;
     border: 1px solid #d9d9d9;
     background: #ffffff;
     box-sizing: border-box;
   }
 </style>


 <!-- Estrutura da Janela Ativa -->
 <div class="window active" id="minhaJanela">
   <!-- Barra de TÃ­tulo -->
   <div class="title-bar">
     <div class="title-bar-text" id="tituloJanela">Programa</div>
     <div class="title-bar-controls">
       <button aria-label="Minimize"></button>
       <button aria-label="Maximize"></button>
       <button aria-label="Close" id="btnFechar"></button>
     </div>
   </div>

   <!-- Corpo da Janela contendo o iframe -->
   <div class="window-body">
     <!-- O 'src' serÃ¡ preenchido dinamicamente pelo JavaScript -->
     <iframe id="meuIframe" src="" srcdoc="&lt;h2 style='font-family: sans-serif; text-align: center; margin-top: 50px;'&gt;Insira o parÃ¢metro ?l=link na URL&lt;/h2&gt;"></iframe>
   </div>
 </div>

 <script>
   // 1. LÃ³gica para capturar o parÃ¢metro 'l' da URL
   const urlParams = new URLSearchParams(window.location.search);
   const linkParam = urlParams.get("l"); // Captura o valor de ?l=...
   const iframe = document.getElementById("meuIframe");
   const titulo = document.getElementById("tituloJanela");

   if (linkParam) {
     // Altera o src do iframe para a URL passada no parÃ¢metro
     iframe.src = linkParam;

     // Opcional: Atualiza o tÃ­tulo da barra com o nome do link
     titulo.textContent = `setup`;
   } else {

     iframe.srcdoc =
       "<h2 style='font-family: sans-serif; text-align: center; margin-top: 50px;'></h2>";
   }


   const janela = document.getElementById("minhaJanela");
   const btnFechar = document.getElementById("btnFechar");

   btnFechar.addEventListener("click", () => {
     janela.classList.add("hidden");
   });
 </script>
